name: macOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Create build directory
      run: |
        mkdir -p build dist release

    - name: Verify project structure
      run: |
        echo "=== Project structure ==="
        ls -la
        echo "=== Checking required directories ==="
        ls -la Config/ || echo "Config directory missing"
        ls -la RemoteScript/ || echo "RemoteScript directory missing"
        ls -la Docs/ || echo "Docs directory missing"
        echo "=== Checking required files ==="
        ls -la launch_profesor_ableton.py || echo "Main script missing"
        ls -la requirements.txt || echo "Requirements file missing"
        ls -la *.md || echo "Documentation files"
        echo "=== Checking Python version ==="
        python --version
        pip --version

    - name: Run PyInstaller
      run: |
        pyinstaller --noconfirm --clean ProfesorAbelton.spec

    - name: Create macOS app bundle
      run: |
        # Create proper .app structure
        mkdir -p "dist/ProfesorAbelton.app/Contents/MacOS"
        mkdir -p "dist/ProfesorAbelton.app/Contents/Resources"

        # Copy executable
        cp "dist/ProfesorAbelton" "dist/ProfesorAbelton.app/Contents/MacOS/"

        # Create Info.plist
        cat > "dist/ProfesorAbelton.app/Contents/Info.plist" << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>ProfesorAbelton</string>
            <key>CFBundleIdentifier</key>
            <string>com.profesorabelton.app</string>
            <key>CFBundleName</key>
            <string>Profesor Abelton</string>
            <key>CFBundleVersion</key>
            <string>2.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>2.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
        </dict>
        </plist>
        EOF

    - name: Create ZIP for distribution
      run: |
        cd dist
        ditto -c -k --sequesterRsrc --keepParent "ProfesorAbelton.app" "../release/ProfesorAbelton_macOS_v2.0.0.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          dist/ProfesorAbelton.app
          release/ProfesorAbelton_macOS_v2.0.0.zip